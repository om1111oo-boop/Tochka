<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Точка">
<meta name="theme-color" content="#111318">
<title>Точка</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
:root{
  --card:#ffffff;--text:#111318;--muted:#6b7280;--line:#e5e7eb;--accent:#2563eb;--shadow:0 4px 18px rgba(0,0,0,.18);
  --top:env(safe-area-inset-top,0px);--bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--card:#1c1f26;--text:#f3f4f6;--muted:#9ca3af;--line:#2d313a;--accent:#4f8cff;}}
:root[data-theme="dark"]{--card:#1c1f26;--text:#f3f4f6;--muted:#9ca3af;--line:#2d313a;--accent:#4f8cff;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#111318;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;color:var(--text)}
#map{position:absolute;inset:0}
.maplibregl-ctrl-attrib{font-size:10px}

#top{position:absolute;left:12px;right:12px;top:calc(var(--top) + 10px);z-index:5;display:flex;flex-direction:column;gap:8px}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:0 14px;height:52px}
.search input{flex:1;border:0;outline:0;background:transparent;color:var(--text);font-size:17px;height:100%;min-width:0}
.search .clear{border:0;background:transparent;color:var(--muted);font-size:20px;display:none}
#results{background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden;display:none;max-height:50vh;overflow-y:auto}
.res{padding:12px 16px;border-bottom:1px solid var(--line)}
.res:last-child{border-bottom:0}
.res b{display:block;font-size:16px;font-weight:600}
.res span{font-size:13px;color:var(--muted)}
#status{align-self:flex-start;color:#fff;font-size:13px;font-weight:600;padding:7px 12px;border-radius:999px;background:#6b7280;box-shadow:var(--shadow);transition:background .4s}

#banner{display:none;background:#0f5132;color:#fff;border-radius:18px;box-shadow:var(--shadow);padding:14px 16px;align-items:center;gap:14px}
#banner .arrow{font-size:40px;line-height:1;width:48px;text-align:center}
#banner .dist{font-size:28px;font-weight:800}
#banner .txt{font-size:16px;opacity:.95}

#fabs{position:absolute;right:12px;z-index:5;display:flex;flex-direction:column;gap:10px;bottom:calc(var(--bottom) + 24px);transition:bottom .25s}
.fab{width:50px;height:50px;border-radius:50%;border:0;background:var(--card);color:var(--text);box-shadow:var(--shadow);font-size:22px;display:flex;align-items:center;justify-content:center}
.fab.txt{font-size:15px;font-weight:800}
.fab.on{color:var(--accent)}

#sheet{position:absolute;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-radius:22px 22px 0 0;box-shadow:0 -4px 20px rgba(0,0,0,.2);padding:10px 18px calc(var(--bottom) + 18px);transform:translateY(110%);transition:transform .25s}
#sheet.open{transform:translateY(0)}
#sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 12px}
#sheet h2{margin:0 0 4px;font-size:21px}
#sheet p{margin:0 0 14px;color:var(--muted);font-size:14px}
.row{display:flex;gap:10px}
.btn{flex:1;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:700;background:var(--accent);color:#fff}
.btn:disabled{opacity:.6}
.btn.sec{background:var(--line);color:var(--text);flex:0 0 auto;padding:15px 18px}
.btn.red{background:#dc2626}
.big{font-size:26px;font-weight:800;margin-bottom:2px}

.me{width:26px;height:26px;position:relative}
.me .cone{position:absolute;left:50%;top:50%;width:0;height:0;transform:translate(-50%,-100%);border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:34px solid rgba(37,99,235,.35);display:none}
.me .d{position:absolute;inset:4px;border-radius:50%;background:#2563eb;border:3px solid #fff;box-shadow:0 1px 6px rgba(0,0,0,.4)}
.me.dr .d{background:#dc2626}.me.dr .cone{border-bottom-color:rgba(220,38,38,.35)}
.me.wifi .d{background:#ea580c}

#intro{position:absolute;inset:0;z-index:20;background:var(--card);display:flex;flex-direction:column;justify-content:center;overflow-y:auto;padding:calc(var(--top) + 14px) 28px calc(var(--bottom) + 30px);gap:14px}
#intro h1{margin:0;font-size:46px;text-align:center}
#intro .lead{text-align:center;font-size:17px;line-height:1.45;color:var(--muted)}
#intro ul{list-style:none;padding:0;margin:10px 0 18px;font-size:16px;line-height:1.4}
#intro li{display:flex;gap:10px;margin:10px 0}
#intro .btn{flex:0 0 auto}
#intro small{text-align:center;color:var(--muted);font-size:13px;line-height:1.4}
.langs{align-self:flex-end;margin-bottom:auto;display:flex;flex:0 0 auto;background:var(--line);border-radius:999px;padding:3px}
#intro small{margin-bottom:auto}
.langs button{border:0;background:transparent;color:var(--text);font-weight:700;font-size:14px;padding:7px 14px;border-radius:999px}
.langs button.on{background:var(--accent);color:#fff}
#auth{display:none;flex-direction:column;gap:10px}
#auth input{height:52px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--text);padding:0 14px;font-size:17px;outline:0}
#auth input:focus{border-color:var(--accent)}
#authErr{color:#dc2626;font-size:14px;min-height:18px;text-align:center}
.authlinks{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-top:4px}
.authlinks a{color:var(--accent);cursor:pointer}

#toast{position:absolute;left:50%;top:calc(var(--top) + 140px);transform:translateX(-50%);z-index:30;background:rgba(17,19,24,.9);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;max-width:85%;text-align:center}
</style>
</head>
<body>

    <span>🔎</span>
    <input id="q" type="search" data-i18n-ph="searchPh" autocomplete="off" enterkeyhint="search">
    <button class="clear" id="clear" aria-label="✕">✕</button>
  </div>
  <div id="results"></div>
  <div id="banner"><div class="arrow" id="bArrow">↑</div><div><div class="dist" id="bDist">—</div><div class="txt" id="bTxt">—</div></div></div>
  <div id="status"></div>
</div>

<div id="fabs">
  <button class="fab" id="acct" aria-label="Account" style="display:none">👤</button>
  <button class="fab txt" id="langFab" aria-label="Language">UA</button>
  <button class="fab" id="voice" aria-label="Voice">🔊</button>
  <button class="fab" id="north" aria-label="North">🧭</button>

    <li><span>📶</span><span data-i18n="f4"></span></li>
    <li><span>🧭</span><span data-i18n="f5"></span></li>
  </ul>
  <div id="auth">
    <input id="email" type="email" data-i18n-ph="emailPh" autocomplete="email" inputmode="email">
    <input id="pass" type="password" data-i18n-ph="passPh" autocomplete="current-password">
    <div id="authErr"></div>
    <button class="btn" id="authBtn"></button>
    <div class="authlinks"><a id="toggleMode"></a><a id="forgot" data-i18n="forgot"></a></div>
  </div>
  <button class="btn" id="startBtn" data-i18n="start"></button>
  <small data-i18n="hint"></small>
</div>

<div id="toast"></div>

function detectLang(){
  try{const s=localStorage.getItem("tochka.lang");if(s==="uk"||s==="ru")return s;}catch(e){}
  const n=(navigator.languages||[navigator.language||""]).join(",").toLowerCase();
  if(/(^|,)uk/.test(n))return"uk";
  if(/(^|,)ru/.test(n))return"ru";
  return"uk";
}
let lang=detectLang();
const t=()=>T[lang];
let authMode="login";
function applyLang(){
  document.documentElement.lang=lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=t()[el.dataset.i18n]);
  document.querySelectorAll("[data-i18n-ph]").forEach(el=>el.placeholder=t()[el.dataset.i18nPh]);
  document.querySelectorAll(".langs button").forEach(b=>b.classList.toggle("on",b.dataset.lang===lang));
  $("#langFab").textContent=lang==="uk"?"UA":"RU";
  $("#authBtn").textContent=authMode==="login"?t().login:t().signup;
  $("#toggleMode").textContent=authMode==="login"?t().toSignup:t().toLogin;
  renderStatus();
  if(nav.active&&L.pos)updateNav(L.pos);
}
function setLang(l){lang=l;try{localStorage.setItem("tochka.lang",l);}catch(e){}applyLang();}
document.querySelectorAll(".langs button").forEach(b=>b.onclick=()=>setLang(b.dataset.lang));

/* ================= Геометрия ================= */
const RAD=Math.PI/180;
function hav(a,b){const dLat=(b[1]-a[1])*RAD,dLon=(b[0]-a[0])*RAD;const h=Math.sin(dLat/2)**2+Math.cos(a[1]*RAD)*Math.cos(b[1]*RAD)*Math.sin(dLon/2)**2;return 2*6371000*Math.asin(Math.min(1,Math.sqrt(h)));}
function brg(a,b){const p1=a[1]*RAD,p2=b[1]*RAD,dl=(b[0]-a[0])*RAD;const y=Math.sin(dl)*Math.cos(p2),x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return(Math.atan2(y,x)/RAD+360)%360;}
function dest(p,b,d){const r=6371000,br=b*RAD,p1=p[1]*RAD,l1=p[0]*RAD,dd=d/r;const p2=Math.asin(Math.sin(p1)*Math.cos(dd)+Math.cos(p1)*Math.sin(dd)*Math.cos(br));const l2=l1+Math.atan2(Math.sin(br)*Math.sin(dd)*Math.cos(p1),Math.cos(dd)-Math.sin(p1)*Math.sin(p2));return[l2/RAD,p2/RAD];}
function circle(p,r){const pts=[];for(let i=0;i<=48;i++)pts.push(dest(p,i*7.5,r));return{type:"Feature",geometry:{type:"Polygon",coordinates:[pts]}};}
function fmtDist(d){if(d<1000)return Math.max(10,Math.round(d/10)*10)+" "+t().m;return(d/1000).toFixed(d<10000?1:0).replace(".",",")+" "+t().km;}
function fmtTime(s){const m=Math.max(1,Math.round(s/60));if(m<60)return m+" "+t().min;return Math.floor(m/60)+" "+t().h+" "+(m%60)+" "+t().min;}
function toast(msg){const el=$("#toast");el.textContent=msg;el.style.display="block";clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display="none",2600);}

/* ================= Карта ================= */
const map=new maplibregl.Map({container:"map",style:CFG.style,center:CFG.center,zoom:12.5,attributionControl:{compact:true}});
let mapReady=false;
map.on("load",()=>{
  map.addSource("acc",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  map.addLayer({id:"acc-fill",type:"fill",source:"acc",paint:{"fill-color":"#2563eb","fill-opacity":0.12}});
  map.addLayer({id:"acc-line",type:"line",source:"acc",paint:{"line-color":"#2563eb","line-opacity":0.5,"line-width":1}});
  map.addSource("route",{type:"geojson",data:{type:"FeatureCollection",features:[]}});
  map.addLayer({id:"route-casing",type:"line",source:"route",layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#1e40af","line-width":11}});
  map.addLayer({id:"route-line",type:"line",source:"route",layout:{"line-join":"round","line-cap":"round"},paint:{"line-color":"#3b82f6","line-width":7}});
  mapReady=true;
});
const meEl=document.createElement("div");meEl.className="me";meEl.innerHTML='<div class="cone"></div><div class="d"></div>';
const meMarker=new maplibregl.Marker({element:meEl,rotationAlignment:"map",pitchAlignment:"map"});
let meAdded=false,destMarker=null,follow=false;
map.on("dragstart",()=>{follow=false;$("#locate").classList.remove("on");});

/* ================= Позиция с защитой от РЭБ ================= */
const L={good:null,goodAt:0,goodAlong:null,speed:0,course:null,heading:null,offset:null,state:"none",src:null,acc:0,pos:null};
const nav={active:false,step:1,said:{},lastReroute:0};
const R={coords:null,cum:null,steps:null,stepAlong:null,distance:0,duration:0};
function inArea(p){return p[0]>=CFG.bbox[0]&&p[0]<=CFG.bbox[2]&&p[1]>=CFG.bbox[1]&&p[1]<=CFG.bbox[3];}

function onPosition(pos){
  const p=[pos.coords.longitude,pos.coords.latitude],acc=pos.coords.accuracy||50,ts=pos.timestamp||Date.now();
  if(!inArea(p)){L.state="spoof";return;}
  if(L.good&&Date.now()-L.goodAt<CFG.drMax){
    const dt=Math.max((ts-L.good.t)/1000,1);
    if(hav(L.good.p,p)>CFG.maxSpeed*dt+L.good.acc+acc+100){L.state="spoof";return;}
  }
  L.state=acc<=30?"ok":"weak";
  const s=pos.coords.speed;
  if(s!=null&&s>=0)L.speed=s;
  else if(L.good){const dt=(ts-L.good.t)/1000;if(dt>0.5)L.speed=Math.min(hav(L.good.p,p)/dt,30);}
  let c=null;const hd=pos.coords.heading;
  if(hd!=null&&!isNaN(hd)&&L.speed>3)c=hd;
  else if(L.good&&hav(L.good.p,p)>30)c=brg(L.good.p,p);
  if(c!=null){L.course=c;if(L.heading!=null)L.offset=(c-L.heading+360)%360;}
  L.good={p,acc,t:ts};L.goodAt=Date.now();
  L.goodAlong=R.coords?along(p).along:null;
  publish(p,acc,acc<=30?"gps":"wifi");
}
let geoDenied=false;
function onGeoErr(e){if(e.code===1){geoDenied=true;renderStatus();}}
function tick(){if(L.good&&Date.now()-L.goodAt>2500)deadReckon();}
function deadReckon(){
  const dt=(Date.now()-L.goodAt)/1000;
  if(dt*1000>CFG.drMax){publish(L.good.p,L.good.acc+500,"dr");return;}
  let p=L.good.p;
  if(nav.active&&L.speed>1&&L.goodAlong!=null){p=pointAt(L.goodAlong+L.speed*dt);}
  else{
    const dir=(L.heading!=null&&L.offset!=null)?(L.heading+L.offset)%360:L.course;
    if(dir!=null&&L.speed>1)p=dest(p,dir,L.speed*dt);
  }
  const src=(dt<20&&L.good.acc>30&&L.state!=="spoof")?"wifi":"dr";
  publish(p,L.good.acc+dt*4,src);
}
function onOrient(e){
  let h=null;
  if(typeof e.webkitCompassHeading==="number")h=e.webkitCompassHeading;
  else if(e.absolute&&e.alpha!=null)h=(360-e.alpha)%360;
  if(h!=null)L.heading=h;
}
function currentDir(){
  if(L.speed>3&&L.course!=null&&L.src!=="dr")return L.course;
  if(L.heading!=null&&L.offset!=null)return(L.heading+L.offset)%360;
  if(L.heading!=null)return L.heading;
  return L.course;
}
function publish(p,acc,src){
  L.pos=p;L.acc=acc;L.src=src;
  if(!meAdded){meMarker.setLngLat(p).addTo(map);meAdded=true;map.jumpTo({center:p,zoom:16});follow=true;$("#locate").classList.add("on");}
  meMarker.setLngLat(p);
  meEl.className="me"+(src==="dr"?" dr":src==="wifi"?" wifi":"");
  const dir=currentDir(),cone=meEl.querySelector(".cone");
  if(dir!=null){cone.style.display="block";meMarker.setRotation(dir);}else cone.style.display="none";
  if(mapReady)map.getSource("acc").setData(circle(p,Math.max(acc,5)));
  renderStatus();
  if(nav.active)updateNav(p);
  if(follow){
    if(nav.active)map.easeTo({center:p,bearing:dir??map.getBearing(),pitch:55,zoom:17,duration:900});
    else map.easeTo({center:p,duration:700});
  }
}
function renderStatus(){
  const el=$("#status");let txt,c;const a=" · ±"+Math.round(L.acc)+" "+t().m;
  if(geoDenied&&!L.pos){txt=t().geoDenied;c="#6b7280";}
  else if(!L.pos){txt=t().searching;c="#6b7280";}
  else if(L.src==="gps"){txt=t().gps+a;c="#15803d";}
  else if(L.src==="wifi"){txt=t().wifi+a;c="#ea580c";}
  else{txt=(L.state==="spoof"?t().spoof:t().noSig)+(nav.active?t().byRoute:t().byCompass)+a;c="#dc2626";}
  el.textContent=txt;el.style.background=c;
}

/* ================= Поиск ================= */
let sTimer=null;
$("#q").addEventListener("input",e=>{
  const q=e.target.value.trim();$("#clear").style.display=q?"block":"none";
  clearTimeout(sTimer);if(q.length<3){$("#results").style.display="none";return;}
  sTimer=setTimeout(()=>search(q),350);
});
$("#clear").onclick=()=>{$("#q").value="";$("#clear").style.display="none";$("#results").style.display="none";};
async function search(q){
  const c=L.pos||map.getCenter().toArray();
  try{
    const r=await fetch(CFG.search+"?q="+encodeURIComponent(q)+"&lat="+c[1]+"&lon="+c[0]+"&limit=7");
    const j=await r.json();showResults(j.features||[]);
  }catch(e){showResults(null);}
}
function describe(f){
  const p=f.properties||{};const street=[p.street,p.housenumber].filter(Boolean).join(", ");
  const name=p.name||street||t().noName;
  const addr=[p.name&&street?street:null,p.district,p.city||p.county].filter(Boolean).join(", ");
  return{name,addr};
}
function showResults(list){
  const box=$("#results");box.innerHTML="";
  const note=msg=>{const d=document.createElement("div");d.className="res";const s=document.createElement("span");s.textContent=msg;d.appendChild(s);box.appendChild(d);};
  if(list===null)note(t().noSearch);
  else if(!list.length)note(t().nothing);
  else list.forEach(f=>{
    const d=describe(f);const el=document.createElement("div");el.className="res";
    const dist=L.pos?" · "+fmtDist(hav(L.pos,f.geometry.coordinates)):"";
    el.innerHTML="<b></b><span></span>";el.querySelector("b").textContent=d.name;el.querySelector("span").textContent=(d.addr||"")+dist;
    el.onclick=()=>{box.style.display="none";$("#q").blur();selectPlace(f.geometry.coordinates,d.name,d.addr);};
    box.appendChild(el);
  });
  box.style.display="block";
}

/* ================= Выбор места ================= */
let D=null;
function selectPlace(p,name,addr){
  D={p,name,addr};
  if(destMarker)destMarker.remove();
  destMarker=new maplibregl.Marker({color:"#dc2626"}).setLngLat(p).addTo(map);
  follow=false;$("#locate").classList.remove("on");
  map.flyTo({center:p,zoom:16});
  const dist=L.pos?fmtDist(hav(L.pos,p))+t().fromYou:"";
  openSheet('<h2></h2><p></p><div class="row"><button class="btn" id="goRoute"></button><button class="btn sec" id="closeSheet">✕</button></div>');
  $("#sheetBody h2").textContent=name;$("#sheetBody p").textContent=[addr,dist].filter(Boolean).join(" · ");
  $("#goRoute").textContent=t().route;
  $("#goRoute").onclick=()=>buildRoute(false);$("#closeSheet").onclick=clearAll;
}
map.on("click",e=>{
  if(nav.active)return;
  if($("#results").style.display==="block"){$("#results").style.display="none";return;}
  const p=e.lngLat.toArray();selectPlace(p,t().pointOnMap,p[1].toFixed(5)+", "+p[0].toFixed(5));
});
function openSheet(html){$("#sheetBody").innerHTML=html;$("#sheet").classList.add("open");requestAnimationFrame(()=>{$("#fabs").style.bottom=($("#sheet").offsetHeight+14)+"px";});}
function closeSheet(){$("#sheet").classList.remove("open");$("#fabs").style.bottom="";}
function clearAll(){
  closeSheet();if(destMarker){destMarker.remove();destMarker=null;}D=null;R.coords=null;L.goodAlong=null;
  if(mapReady)map.getSource("route").setData({type:"FeatureCollection",features:[]});
}

/* ================= Маршрут ================= */
async function buildRoute(isReroute){
  if(!L.pos){toast(t().waitPos);return;}
  if(!D)return;
  if(!isReroute)toast(t().building);
  try{
    const u=CFG.route+L.pos[0]+","+L.pos[1]+";"+D.p[0]+","+D.p[1]+"?overview=full&geometries=geojson&steps=true";
    const j=await (await fetch(u)).json();
    if(j.code!=="Ok"||!j.routes||!j.routes.length){toast(t().noRoute);return;}
    setRoute(j.routes[0]);
    if(isReroute){nav.step=1;nav.said={};speak(t().rerouted);}
    else showRouteSheet();
  }catch(e){toast(t().noRouteNet);}
}
function setRoute(rt){
  R.coords=rt.geometry.coordinates;R.cum=[0];
  for(let i=1;i<R.coords.length;i++)R.cum.push(R.cum[i-1]+hav(R.coords[i-1],R.coords[i]));
  R.steps=rt.legs[0].steps;R.distance=rt.distance;R.duration=rt.duration;
  R.stepAlong=R.steps.map(s=>along(s.maneuver.location).along);
  L.goodAlong=L.good?along(L.good.p).along:null;
  map.getSource("route").setData({type:"Feature",geometry:rt.geometry});
}
function along(p){
  let best=Infinity,bi=0;
  for(let i=0;i<R.coords.length;i++){const d=hav(p,R.coords[i]);if(d<best){best=d;bi=i;}}
  return{along:R.cum[bi],dist:best};
}
function pointAt(a){
  const c=R.coords,cum=R.cum;if(a<=0)return c[0];if(a>=cum[cum.length-1])return c[c.length-1];
  let i=1;while(i<cum.length&&cum[i]<a)i++;
  const k=(a-cum[i-1])/((cum[i]-cum[i-1])||1);
  return[c[i-1][0]+(c[i][0]-c[i-1][0])*k,c[i-1][1]+(c[i][1]-c[i-1][1])*k];
}
function showRouteSheet(){
  const b=new maplibregl.LngLatBounds();R.coords.forEach(c=>b.extend(c));
  map.fitBounds(b,{padding:{top:150,bottom:260,left:40,right:40},duration:800});
  openSheet('<div class="big"></div><p></p><div class="row"><button class="btn" id="goNav"></button><button class="btn sec" id="closeSheet">✕</button></div>');
  $("#sheetBody .big").textContent=fmtTime(R.duration);
  $("#sheetBody p").textContent=fmtDist(R.distance)+" · "+D.name;
  $("#goNav").textContent=t().go;
  $("#goNav").onclick=startNav;$("#closeSheet").onclick=clearAll;
}

/* ================= Навигация ================= */
const ARROWS={"left":"↰","right":"↱","slight left":"↖","slight right":"↗","sharp left":"↙","sharp right":"↘","straight":"↑","uturn":"↶"};
function instr(s){
  const x=t(),m=s.maneuver,mod=m.modifier||"",dir=x.dirs[mod]||"",name=s.name?x.on+s.name:"",left=mod.indexOf("left")>=0;
  switch(m.type){
    case "depart":return x.depart+name;
    case "arrive":return x.arrived;
    case "roundabout":case "rotary":case "roundabout turn":return x.round(m.exit)+name;
    case "exit roundabout":case "exit rotary":return x.exitRound+name;
    case "fork":return x.fork(left)+name;
    case "merge":return x.merge+name;
    case "on ramp":return x.onRamp+name;
    case "off ramp":return x.offRamp(left)+name;
    case "end of road":return x.endRoad(dir)+name;
    case "continue":case "new name":return(mod==="straight"||!dir)?x.cont+name:x.keep(dir)+name;
    default:
      if(mod==="uturn")return x.uturn+name;
      if(mod==="straight"||!dir)return x.straight+name;
      return x.turn(dir)+name;
  }
}
function arrow(s){const ty=s.maneuver.type;if(ty==="arrive")return"🏁";if(ty.indexOf("round")>=0||ty.indexOf("rotary")>=0)return"⟳";return ARROWS[s.maneuver.modifier]||"↑";}

let voiceOn=true;
function speak(txt){
  if(!voiceOn||!("speechSynthesis" in window))return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang=t().voice;u.rate=1.02;speechSynthesis.speak(u);}catch(e){}
}
$("#voice").onclick=()=>{voiceOn=!voiceOn;$("#voice").textContent=voiceOn?"🔊":"🔇";if(voiceOn)speak(t().voiceOn);};

function startNav(){
  nav.active=true;nav.step=1;nav.said={};follow=true;$("#locate").classList.add("on");
  $("#searchBox").style.display="none";$("#results").style.display="none";$("#banner").style.display="flex";
  openSheet('<div class="row" style="align-items:center"><div style="flex:1"><div class="big" id="nEta">—</div><p id="nRem" style="margin:0">—</p></div><button class="btn red" id="stopNav" style="flex:0 0 auto"></button></div>');
  $("#stopNav").textContent=t().finish;$("#stopNav").onclick=stopNav;
  const first=R.steps[1];
  speak(t().goVoice+" "+(first?instr(first):""));
  if(L.pos)updateNav(L.pos);
}
function stopNav(){
  nav.active=false;$("#banner").style.display="none";$("#searchBox").style.display="flex";
  map.easeTo({pitch:0,bearing:0,duration:600});clearAll();renderStatus();
}
function updateNav(p){
  const a=along(p);
  if(a.dist>60&&L.src!=="dr"&&Date.now()-nav.lastReroute>15000){nav.lastReroute=Date.now();buildRoute(true);return;}
  while(nav.step<R.steps.length-1&&a.along>R.stepAlong[nav.step]+15)nav.step++;
  const s=R.steps[nav.step];if(!s)return;
  const d=Math.max(0,R.stepAlong[nav.step]-a.along);
  $("#bArrow").textContent=arrow(s);$("#bDist").textContent=fmtDist(d);$("#bTxt").textContent=instr(s);
  const rem=Math.max(0,R.cum[R.cum.length-1]-a.along),avg=R.distance/Math.max(R.duration,1);
  if($("#nEta"))$("#nEta").textContent=fmtTime(rem/avg);
  if($("#nRem"))$("#nRem").textContent=fmtDist(rem)+" · "+t().arrivalAt+new Date(Date.now()+rem/avg*1000).toLocaleTimeString(t().locale,{hour:"2-digit",minute:"2-digit"});
  if($("#stopNav"))$("#stopNav").textContent=t().finish;
  if(s.maneuver.type==="arrive"&&d<30){speak(t().arrived);stopNav();toast(t().arrivedToast);return;}
  if(d<250&&d>60&&!nav.said[nav.step+"f"]){nav.said[nav.step+"f"]=1;speak(t().in+fmtDist(d)+" — "+instr(s).toLowerCase());}
  if(d<40&&!nav.said[nav.step+"n"]){nav.said[nav.step+"n"]=1;speak(instr(s));}
}

/* ================= Кнопки ================= */
$("#locate").onclick=()=>{
  if(!L.pos){toast(t().noPos);return;}
  follow=true;$("#locate").classList.add("on");
  map.easeTo({center:L.pos,zoom:Math.max(map.getZoom(),16),duration:600});
};
$("#north").onclick=()=>map.easeTo({bearing:0,pitch:0,duration:500});

/* ================= Запуск ================= */
let wake=null;
async function requestWake(){try{if("wakeLock" in navigator)wake=await navigator.wakeLock.request("screen");}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")requestWake();});
let started=false,orientAsked=false;
function reqOrient(){
  if(orientAsked)return;orientAsked=true;
  try{if(typeof DeviceOrientationEvent!=="undefined"&&typeof DeviceOrientationEvent.requestPermission==="function")DeviceOrientationEvent.requestPermission().catch(()=>{});}catch(e){}
}
function start(){
  if(started)return;started=true;
  window.addEventListener("deviceorientation",onOrient);
  window.addEventListener("deviceorientationabsolute",onOrient);
  if(!orientAsked)document.addEventListener("click",reqOrient,{once:true});
  if(!("geolocation" in navigator)){toast(t().geoNone);return;}
  navigator.geolocation.watchPosition(onPosition,onGeoErr,{enableHighAccuracy:true,maximumAge:0,timeout:20000});
  setInterval(tick,1000);requestWake();
}
$("#startBtn").onclick=()=>{reqOrient();$("#intro").style.display="none";start();};

/* ================= Регистрация (Firebase) ================= */
let fbAuth=null;
try{if(FIREBASE_CONFIG&&window.firebase){firebase.initializeApp(FIREBASE_CONFIG);fbAuth=firebase.auth();}}catch(e){fbAuth=null;}
if(fbAuth){
  $("#startBtn").style.display="none";$("#auth").style.display="flex";$("#acct").style.display="flex";
  const errMsg=c=>t().errs[c]||(t().err+c);
  $("#toggleMode").onclick=()=>{authMode=authMode==="login"?"signup":"login";$("#pass").autocomplete=authMode==="login"?"current-password":"new-password";$("#authErr").textContent="";applyLang();};
  $("#authBtn").onclick=async()=>{
    reqOrient();
    const e=$("#email").value.trim(),p=$("#pass").value;
    $("#authBtn").disabled=true;$("#authErr").textContent="";
    try{if(authMode==="login")await fbAuth.signInWithEmailAndPassword(e,p);else await fbAuth.createUserWithEmailAndPassword(e,p);}
    catch(err){$("#authErr").textContent=errMsg(err.code);}
    $("#authBtn").disabled=false;
  };
  $("#forgot").onclick=async()=>{
    const e=$("#email").value.trim();if(!e){$("#authErr").textContent=t().enterEmail;return;}
    try{fbAuth.languageCode=lang;await fbAuth.sendPasswordResetEmail(e);$("#authErr").textContent="";toast(t().resetSent);}
    catch(err){$("#authErr").textContent=errMsg(err.code);}
  };
  fbAuth.onAuthStateChanged(u=>{
    if(u){$("#intro").style.display="none";start();}
    else $("#intro").style.display="flex";
  });
  $("#acct").onclick=()=>{
    const u=fbAuth.currentUser;
    openSheet('<h2></h2><p id="accMail"></p><div class="row"><button class="btn red" id="logout"></button><button class="btn sec" id="closeSheet">✕</button></div>');
    $("#sheetBody h2").textContent=t().account;$("#accMail").textContent=u?u.email:"";
    $("#logout").textContent=t().logout;
    $("#logout").onclick=()=>fbAuth.signOut().then(()=>location.reload());
    $("#closeSheet").onclick=closeSheet;
  };
}

applyLang();
})();
</script>
